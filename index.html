<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eesti">
<title>Eesti A2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>Eesti A2</h1>
  <div id="stats" class="stats"></div>
</header>

<nav id="modes" class="modes">
  <button data-mode="forms" class="active">Формы</button>
  <button data-mode="vocab">Слова</button>
  <button data-mode="mix">Микс</button>
  <button data-mode="cheat">Шпаргалка</button>
</nav>

<main id="card" class="card"></main>

<div id="pad" class="pad" hidden>
  <button type="button" data-ch="õ">õ</button>
  <button type="button" data-ch="ä">ä</button>
  <button type="button" data-ch="ö">ö</button>
  <button type="button" data-ch="ü">ü</button>
  <button type="button" data-ch="š">š</button>
  <button type="button" data-ch="ž">ž</button>
</div>

<footer>
  <button id="btn-settings" type="button">Настройки</button>
  <span id="version" class="version"></span>
</footer>

<dialog id="settings">
  <form method="dialog">
    <h2>Настройки</h2>
    <label>Новых слов в день
      <input id="set-new" type="number" min="0" max="100" step="1">
    </label>
    <p class="hint">Прогресс хранится в этом браузере. Выгружай бэкап перед сменой устройства.</p>
    <div class="row">
      <button id="btn-export" type="button">Выгрузить прогресс</button>
      <button id="btn-import" type="button">Загрузить прогресс</button>
    </div>
    <div class="row">
      <button id="btn-reset" type="button" class="danger">Сбросить всё</button>
      <button value="ok" class="primary">Готово</button>
    </div>
  </form>
</dialog>
<input id="file-import" type="file" accept="application/json" hidden>

<script src="app.js"></script>
</body>
</html>
